name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - uses: gradle/actions/setup-gradle@v3
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    - name: Upload ARM64 APK
      uses: actions/upload-artifact@v4
      with:
        name: ytclip-arm64
        path: app/build/outputs/apk/generic/debug/*-arm64-v8a-debug.apk
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.2.0
        name: ytclip v1.2.0
        body: |
          ## ytclip Android APK
          
          ### Download
          - **arm64-v8a** (63MB) — Most modern phones (2018+)
          - **universal** (160MB) — All phones
          
          ### Install
          1. Download the APK
          2. Open file manager
          3. Tap the APK
          4. Allow "Install from unknown sources" if prompted
          5. Done
          
          ### First Launch
          - Go to Settings → yt-dlp → **Update yt-dlp** (important!)
          - This fixes YouTube "Precondition check failed" errors
          
          ### Features
          - Clip YouTube videos by timestamps
          - Download transcripts (SRT/VTT)
          - Multiple quality options
          - No watermark, no signup, no limits
        files: |
          app/build/outputs/apk/generic/debug/*-arm64-v8a-debug.apk
          app/build/outputs/apk/generic/debug/*-universal-debug.apk
        generate_release_notes: false
